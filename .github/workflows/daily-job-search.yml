name: Daily Adzuna Job Search

on:
  schedule:
    # 20:00 UTC = 6:00am Sydney (AEST, UTC+10). NOTE: Sydney observes daylight
    # saving (AEDT, UTC+11) from early Oct to early Apr - this will run at
    # 7:00am local time during that window unless the cron is shifted to
    # 19:00 UTC. Ask Claude to update this when DST changes.
    - cron: "0 20 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-job-search
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Adzuna listings and score fit
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python3 scripts/fetch_jobs.py

      - name: Commit results
        run: |
          git config user.name "job-search-bot"
          git config user.email "actions@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add latest_results.json seen_urls.json

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "Daily job search results $(date -u +%F) (attempt $i)"

            if git push origin HEAD:main; then
              echo "Pushed successfully on attempt $i"
              exit 0
            fi

            echo "Push failed on attempt $i, retrying..."
            git reset --soft HEAD~1
            sleep $((RANDOM % 5 + 2))
          done

          echo "Failed to push after 5 attempts"
          exit 1
